name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo files
        run: ls -la

      - name: Print environment info
        run: |
          echo "Run by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Sanity check
        run: |
          test -f README.md && echo "README.md OK"
          test -f gh.md && echo "gh.md OK"
